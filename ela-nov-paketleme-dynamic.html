<script>
(function(){
  const PERSONAL_LAYOUT_KEY='ela-personal-board-v1';const PERSONAL_SNAPSHOT_KEY='ela-personal-snapshot-v1';const PERSONAL_POMODORO_KEY='ela-personal-pomodoro-v1';

    const render=()=>{const filtered=visibleTasks(),groups=groupsFor(filtered);board.innerHTML=groups.map(group=>{const columnTasks=filtered.filter(task=>personalTaskGroupValue(task,groupBy)===group);const canDrop=true;return '<section class="personal-kanban-column" data-personal-status-column="'+escapeHtml(group)+'"><header class="personal-kanban-column-header"><div class="personal-kanban-column-heading"><strong>'+escapeHtml(group)+'</strong><span class="personal-kanban-column-count">'+columnTasks.length+'</span></div><button type="button" class="personal-kanban-add-card" data-kanban-add-group="'+escapeHtml(group)+'" title="Новая задача в колонке">+</button></header><div class="personal-kanban-column-body">'+(columnTasks.length?columnTasks.map(task=>'<article class="personal-kanban-card" draggable="'+(canDrop?'true':'false')+'" data-personal-kanban-task="'+escapeHtml(task.id)+'"><div class="personal-kanban-card-head"><strong>'+escapeHtml(task.title)+'</strong><button type="button" class="personal-kanban-card-open" title="Открыть свойств��">↗</button></div><div class="personal-kanban-chips">'+chip(task.status,'status')+chip(task.priority,'priority')+chip(task.category)+chip((task.tags||[]).join(', '))+chip((task.assignees||[]).join(', '))+chip(task.date,'date')+'</div>'+personalTaskPomodoroIndicator(task)+(groupBy==='status'?'<select data-personal-status="'+escapeHtml(task.id)+'" aria-label="Статус задачи">'+statuses.filter(value=>value!=='Done'||task.status==='Done').map(value=>'<option value="'+escapeHtml(value)+'"'+(value===task.status?' selected':'')+'>'+escapeHtml(value)+'</option>').join('')+'</select>':'')+(personalTasks.filter(item=>item.parentId===task.id&&!item.completed).length?'<button type="button" data-open-personal-subtasks="'+escapeHtml(task.id)+'">Подзадачи</button>':'')+'</article>').join(''):'<div class="personal-kanban-empty">Нет задач</div>')+'</div></section>'}).join('');
      board.querySelectorAll('[data-personal-status]').forEach(select=>select.onchange=()=>updatePersonalTask(select.dataset.personalStatus,{status:select.value,completed:select.value==='Done'},render));

    refreshFilterValues();render();modal.__personalKanbanRefresh=render;searchInput.oninput=()=>{searchText=searchInput.value.trim().toLocaleLowerCase();render()};filterField.onchange=()=>{filterKey=filterField.value;filterValueText='all';refreshFilterValues();render()};filterValue.onchange=()=>{filterValueText=filterValue.value;render()};groupBySelect.onchange=()=>{groupBy=groupBySelect.value;refreshFilterValues();render()};

  async function updatePersonalTask(id,changes,rerender){const task=personalTasks.find(item=>item.id===id);if(!task)return;Object.assign(task,changes);if(changes.status==='Done')changes.completed=true;try{const base=new URL(CONFIG.syncUrl||location.href,location.href);const response=await fetch(base.origin+'/api/personal-task',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,...changes})});if(!response.ok)throw new Error('HTTP '+response.status);if(task.completed)personalTasks=personalTasks.filter(item=>item.id!==id);rerender();renderPersonalBoard()}catch(error){personalError.textContent='Ошибка сохранения задачи: '+error.message;await loadPersonalTasks()}}
  function openPersonalKanbanTool(focus){const modal=openPersonalKanban('Мои задачи',personalTasks.filter(task=>!task.completed));if(modal&&focus)setTimeout(()=>modal.querySelector(focus)?.focus(),0);return modal}
  function setPersonalMode(active){const mode=document.getElementById('personalMode'),layout=document.getElementById('layout');if(!mode||!layout)return;if(!active){personalFocusContainerId='';personalInlineDiagramRoot=''}mode.hidden=!active;layout.hidden=active;document.getElementById('personalModeButton')?.classList.toggle('active',active);document.getElementById('personalMobileButton')?.classList.toggle('active',active);document.querySelectorAll('.equipment-nav-action').forEach(button=>button.hidden=active);document.querySelectorAll('.personal-mode-nav-action').forEach(button=>button.hidden=!active);if(active)loadPersonalTasks()}
  window.__setPersonalMode=setPersonalMode;const personalModeButton=document.getElementById('personalModeButton'),personalMobileButton=document.getElementById('personalMobileButton'),personalCanvasButton=document.getElementById('personalModeCanvasButton');if(personalModeButton)personalModeButton.onclick=()=>setPersonalMode(document.getElementById('personalMode').hidden);if(personalMobileButton)personalMobileButton.onclick=()=>setPersonalMode(true);if(personalCanvasButton)personalCanvasButton.onclick=()=>setPersonalMode(true);document.getElementById('personalBackToEquipment')?.addEventListener('click',()=>setPersonalMode(false));document.getElementById('personalExitFocus')?.addEventListener('click',clearPersonalFocus);document.getElementById('personalFocusKanban')?.addEventListener('click',()=>{const id=personalFocusContainerId,container=containerById(id);if(container)openPersonalKanban(container.name,personalTasksForContainer(id).filter(task=>!task.completed),'',id)});document.getElementById('personalRefresh')?.addEventListener('click',()=>loadPersonalTasks());document.getElementById('personalZoomOut')?.addEventListener('click',()=>setPersonalZoom(personalZoom-.1));document.getElementById('personalZoomFit')?.addEventListener('click',()=>setPersonalZoom(1));document.getElementById('personalZoomIn')?.addEventListener('click',()=>setPersonalZoom(personalZoom+.1));document.getElementById('personalBoardSearch')?.addEventListener('input',event=>{personalBoardSearchText=event.target.value;personalBoardSearchCursor=0;renderPersonalBoard();renderPersonalBoardSearchResults()});document.getElementById('personalBoardSearch')?.addEventListener('focus',()=>renderPersonalBoardSearchResults());document.getElementById('personalBoardSearch')?.addEventListener('keydown',event=>{if(event.key==='ArrowDown'){event.preventDefault();movePersonalBoardSearchCursor(1)}else if(event.key==='ArrowUp'){event.preventDefault();movePersonalBoardSearchCursor(-1)}else if(event.key==='Enter'){event.preventDefault();choosePersonalBoardSearchResult()}else if(event.key==='Escape'){const panel=document.getElementById('personalBoardSearchResults');if(panel)panel.hidden=true}});document.getElementById('search')?.addEventListener('input',event=>{if(!personalMode.hidden){const field=document.getElementById('personalBoardSearch');personalBoardSearchText=event.target.value;personalBoardSearchCursor=0;if(field&&field.value!==event.target.value)field.value=event.target.value;renderPersonalBoard();renderPersonalBoardSearchResults()}});document.getElementById('clearSearch')?.addEventListener('click',()=>{if(!personalMode.hidden){personalBoardSearchText='';const field=document.getElementById('personalBoardSearch');if(field)field.value='';renderPersonalBoard();renderPersonalBoardSearchResults()}});document.querySelector('.personal-board-shell')?.addEventListener('wheel',event=>{if(personalMode.hidden)return;event.preventDefault();const shell=event.currentTarget,oldZoom=personalZoom,rect=shell.getBoundingClientRect(),contentX=(event.clientX-rect.left+shell.scrollLeft)/oldZoom,contentY=(event.clientY-rect.top+shell.scrollTop)/oldZoom;setPersonalZoom(personalZoom+(event.deltaY<0?.1:-.1));shell.scrollLeft=Math.max(0,contentX*personalZoom-(event.clientX-rect.left));shell.scrollTop=Math.max(0,contentY*personalZoom-(event.clientY-rect.top))},{passive:false});document.getElementById('personalMobileKanbanButton')?.addEventListener('click',()=>{setPersonalMode(true);openPersonalKanbanTool()});document.getElementById('personalMobileSearchButton')?.addEventListener('click',()=>{setPersonalMode(true);setTimeout(()=>document.getElementById('personalBoardSearch')?.focus(),0)});document.getElementById('personalMobileFilterButton')?.addEventListener('click',()=>{setPersonalMode(true);openPersonalKanbanTool('#personalKanbanFilterField')});document.getElementById('personalMobileZoomButton')?.addEventListener('click',()=>setPersonalZoom(personalZoom+.1));document.getElementById('personalAllTasksKanban')?.addEventListener('click',()=>openPersonalKanban('Мои задачи',personalTasks.filter(task=>!task.completed)));document.getElementById('personalAddTask')?.addEventListener('click',()=>openPersonalTaskEditor('',true,{containerId:personalFocusContainerId||''}));async function createPersonalContainerFromPrompt(parent=null){const name=prompt(parent?'Название вложенного контейнера':'Название контейнера');if(!name?.trim())return;const index=personalLayout.containers.length,children=parent?personalLayout.containers.filter(item=>item.parentId===parent.id):[],parentX=Number(parent?.x)||40,parentY=Number(parent?.y)||40,parentWidth=Number(parent?.width)||340,parentHeight=Number(parent?.height)||220;const position=parent?{x:parentX+20+(children.length%2)*18,y:parentY+48+Math.floor(children.length/2)*24,width:Math.max(220,Math.min(280,parentWidth-40)),height:Math.max(140,Math.min(170,parentHeight-55)),parentId:parent.id}:{x:60+(index%4)*390,y:60+Math.floor(index/4)*280,width:340,height:220,parentId:null};try{const result=await personalApi('/api/personal-container',{method:'POST',body:JSON.stringify({name:name.trim(),...position,order:index})});if(result.container)personalLayout.containers.push(result.container);writePersonalLayout();renderPersonalBoard()}catch(error){personalError.textContent='Ошибка создания контейнера: '+error.message}}
document.getElementById('personalAddContainer')?.addEventListener('click',()=>createPersonalContainerFromPrompt());document.getElementById('personalResetLayout')?.addEventListener('click',()=>{if(!confirm('Сбросить размещение личной доски?'))return;personalLayout={containers:[],tasks:{}};writePersonalLayout();renderPersonalBoard()});
