function renderTaskFilters(){const panel=document.getElementById('taskFiltersPanel');if(!panel)return;panel.innerHTML='<h3>Фильтры задач</h3><div class="task-filter-field"><label>Состояние</label><select data-task-filter="completed">'+filterOptions(['open','done','all'],taskFilters.completed,'Незавершенные') .replace('value="open"','value="open"') .replace('<option value="done">done</option>','<option value="done">Выполненные</option>').replace('<option value="all">all</option>','<option value="all">Все задачи</option>')+'</select></div><div class="task-filter-field"><label>База</label><select data-task-filter="source">'+filterOptions(['todo','gorulen'],taskFilters.source,'Все базы').replace('<option value="todo">todo</option>','<option value="todo">ToDo</option>').replace('<option value="gorulen">gorulen</option>','<option value="gorulen">Gorulen isler</option>')+'</select></div><div class="task-filter-field"><label>Процесс</label><select data-task-filter="process">'+filterOptions(taskPropertyValues('process'),taskFilters.process,'Все процессы')+'</select></div><div class="task-filter-field"><label>Приоритет</label><select data-task-filter="priority">'+filterOptions(taskPropertyValues('priority'),taskFilters.priority,'Все приоритеты')+'</select></div><div class="task-filter-field"><label>Tapsirildi</label><select data-task-filter="tapsirildi">'+filterOptions(taskPropertyValues('tapsirildi'),taskFilters.tapsirildi,'Все ответственные')+'</select></div><div class="task-filter-field"><label>Дата</label><div class="task-filter-dates"><input type="date" data-task-filter="dateFrom" value="'+escapeHtml(taskFilters.dateFrom)+'" title="Дата от"><input type="date" data-task-filter="dateTo" value="'+escapeHtml(taskFilters.dateTo)+'" title="Дата до"></div></div><div class="task-filter-actions"><button type="button" id="clearTaskFilters">Сбросить</button><button type="button" class="primary-filter" id="applyTaskFilters">Готово</button></div>';panel.querySelectorAll('[data-task-filter]').forEach(input=>{input.onchange=()=>{taskFilters[input.dataset.taskFilter]=input.value;updateTaskFilterUi()};input.oninput=()=>{taskFilters[input.dataset.taskFilter]=input.value;updateTaskFilterUi()}});document.getElementById('clearTaskFilters').onclick=()=>{Object.assign(taskFilters,{completed:'open',source:'',process:'',priority:'',tapsirildi:'',dateFrom:'',dateTo:''});renderTaskFilters();updateTaskFilterUi()};document.getElementById('applyTaskFilters').onclick=()=>{panel.hidden=true;updateTaskFilterUi()}}
function updateTaskFilterUi(){const count=taskFilterCount(),button=document.getElementById('taskFiltersButton'),badge=document.getElementById('taskFilterCount');if(button)button.classList.toggle('has-filters',count>0);if(badge){badge.textContent=count?String(count):'';badge.hidden=!count}renderSearchResults();const modal=document.getElementById('taskModal');if(modal?.classList.contains('open')&&!document.querySelector('.task-editor')){if(modal.dataset.planBoardId)openPlanTasks(modal.dataset.planBoardId);else if(modal.dataset.machineId)openTasks(modal.dataset.machineId)}}

function getSearchResults(){const q=search.value.trim().toLowerCase();if(!q)return[];const results=[];const add=(kind,id,title,subtitle,text,extra={})=>{const hay=String(text||'').toLowerCase();if(!hay.includes(q))return;const starts=hay.indexOf(q)===0||String(title).toLowerCase().startsWith(q);results.push({kind,id,title,subtitle,score:starts?0:1,...extra})};for(const plan of state.plans)add('plan',plan.id,plan.name,plan.parentId?(state.plans.find(p=>p.id===plan.parentId)?.name||'План'): 'Корневой план',[plan.name,plan.type,plan.status,plan.note].join(' '));for(const machine of state.equipment){const plan=state.plans.find(p=>p.id===machine.planId);add('equipment',machine.id,machine.name,[plan?.name||'План',machine.type,machine.status].filter(Boolean).join(' · '),[machine.name,machine.type,machine.status,machine.note,plan?.name].join(' '),{machine});for(const task of machine.tasks||[]){if(!taskMatchesFilters(task))continue;add('task',task.id,task.title||'Без названия',[machine.name,plan?.name,task.source||'Задача'].filter(Boolean).join(' · '),[task.title,task.doneWork,task.source,task.status,task.process,task.priority,machine.name,plan?.name].join(' '),{task,machine})}}return results.sort((a,b)=>a.score-b.score||String(a.title).localeCompare(String(b.title),'ru')).slice(0,14)}
function renderSearchResults(){const panel=document.getElementById('searchResults');if(!panel)return;const query=search.value.trim();if(!query){panel.hidden=true;panel.innerHTML='';return}const items=getSearchResults();searchCursor=Math.min(searchCursor,Math.max(0,items.length-1));if(!items.length){panel.innerHTML='<div class="search-empty">Ничего не найдено</div><div class="search-hint">Попробуйте название плана, машины или задачи</div>';panel.hidden=false;return}panel.innerHTML='<div class="search-results-head">Результаты поиска</div>'+items.map((item,index)=>'<div class="search-result '+(index===searchCursor?'active':'')+'" role="button" tabindex="0" data-search-index="'+index+'" data-kind="'+item.kind+'"><span class="search-result-icon">'+(item.kind==='equipment'?'⚙':item.kind==='task'?'✓':'▦')+'</span><span><strong>'+escapeHtml(item.title)+'</strong><small>'+escapeHtml(item.subtitle||'')+'</small></span>'+(item.kind==='equipment'?'<span class="search-result-actions"><button type="button" class="search-quick-task" data-search-task-index="'+index+'">+ Задача</button></span>':'')+'</div>').join('')+'<div class="search-hint">↑ ↓ выбрать · Enter открыть · «+ Задача» сразу открыть новую задачу</div>';panel.hidden=false;panel.querySelectorAll('[data-search-index]').forEach(row=>{row.onclick=event=>{if(event.target.closest('[data-search-task-index]'))return;const item=items[Number(row.dataset.searchIndex)];if(item)focusSearchResult(item)};row.onkeydown=event=>{if((event.key==='Enter'||event.key===' ')&&!event.target.closest('[data-search-task-index]')){event.preventDefault();const item=items[Number(row.dataset.searchIndex)];if(item)focusSearchResult(item)}}});panel.querySelectorAll('[data-search-task-index]').forEach(button=>{const openFromButton=event=>{event.preventDefault();event.stopPropagation();const item=items[Number(button.dataset.searchTaskIndex)];if(!item||item.kind!=='equipment')return;openNewTaskForMachine(item.machine)};button.onclick=openFromButton;button function handleDeepLink(){if(deepLinkApplied)return;const raw=location.hash.replace(/^#/,'');if(!raw)return;const params=new URLSearchParams(raw),element=params.get('element'),id=params.get('id');if(!id)return;let object=null;if(element==='equipment'||element==='machine')object=state.equipment.find(item=>normalizePageId(item.id)===normalizePageId(id));else if(element==='plan')object=state.plans.find(item=>normalizePageId(item.id)===normalizePageId(id));else if(element==='task'){const info=taskById(id);if(info){state.currentPlan=info.machine.planId;expandPlanPath(info.machine.planId);state.selected=info.machine.id;renderAll();requestAnimationFrame(()=>{focusOnCanvasObject(info.machine,2);openTaskEditor(info.task,info.machine,false)});deepLinkApplied=true;return}}if(!object)return;const targetPlan=element==='plan'?(object.parentId||object.id):object.planId;if(targetPlan)state.currentPlan=targetPlan;expandPlanPath(targetPlan);state.selected=element==='plan'&& !object.parentId?null:object.id;renderAll();if(element!=='plan'||object.parentId)requestAnimationFrame(()=>focusOnCanvasObject(object,2));else{state.scale=2;apply()}deepLinkApplied=true}

function moveSearchCursor(direction){const items=getSearchResults();if(!items.length)return;searchCursor=(searchCursor+direction+items.length)%items.length;renderSearchResults();const active=document.querySelector('.search-result.active');if(active)active.scrollIntoView({block:'nearest'});search.focus()}

const SNAP_DISTANCE=8;

function snapTargets(excludeId){const xs=[0,CANVAS_WIDTH],ys=[0,CANVAS_HEIGHT];for(const other of visibleObjects()){if(other.id===excludeId)continue;const x=Number(other.x)||0,y=Number(other.y)||0,w=Math.max(0,Number(other.width)||0),h=Math.max(0,Number(other.height)||0);xs.push(x,x+w/2,x+w);ys.push(y,y+h/2,y+h)}return{xs,ys}}
function nearestSnap(raw,offsets,targets,disabled){if(disabled)return{value:raw,guide:null};let best=null;for(const offset of offsets)for(const target of targets){const distance=Math.abs(raw+offset-target);if(distance<=SNAP_DISTANCE&&(!best||distance<best.distance))best={target,offset,distance}}if(!best)return{value:raw,guide:null};const correction=best.target-(raw+best.offset);const strength=best.distance<=SNAP_FULL_DISTANCE?1:SNAP_MIN_STRENGTH+(1-SNAP_MIN_STRENGTH)*(SNAP_DISTANCE-best.distance)/(SNAP_DISTANCE-SNAP_FULL_DISTANCE);return{value:raw+correction*strength,guide:best.target}}
function clampPosition(value,max){return Math.max(0,Math.min(max,value))}
function snapMove(o,rawX,rawY,disabled){const targets=snapTargets(o.id);const sx=nearestSnap(rawX,[0,Number(o.width)/2,Number(o.width)],targets.xs,disabled);const sy=nearestSnap(rawY,[0,Number(o.height)/2,Number(o.height)],targets.ys,disabled);return{x:clampPosition(sx.value,CANVAS_WIDTH-Number(o.width)),y:clampPosition(sy.value,CANVAS_HEIGHT-Number(o.height)),guideX:sx.guide,guideY:sy.guide}}
function snapResize(o,rawWidth,rawHeight,disabled){const targets=snapTargets(o.id);const right=nearestSnap(Number(o.x)+rawWidth,[0],targets.xs,disabled);const bottom=nearestSnap(Number(o.y)+rawHeight,[0],targets.ys,disabled);return{width:Math.max(35,right.value-Number(o.x)),height:Math.max(30,bottom.value-Number(o.y)),guideX:right.guide,guideY:bottom.guide}}

const layoutEl=document.getElementById('layout'),treePanel=document.getElementById('treePanel'),inspectorPanel=document.getElementById('inspector');document.getElementById('toggleTree').onclick=()=>{const collapsed=treePanel.classList.toggle('collapsed');layoutEl.classList.toggle('tree-collapsed',collapsed);const b=document.getElementById('toggleTree');b.setAttribute('aria-expanded',String(!collapsed));b.textContent=collapsed?'›':'‹'};document.getElementById('toggleInspector').onclick=()=>{const collapsed=inspectorPanel.classList.toggle('collapsed');layoutEl.classList.toggle('inspector-collapsed',collapsed);const b=document.getElementById('toggleInspector');b.setAttribute('aria-expanded',String(!collapsed));b.textContent=collapsed?'‹':'›'};document.getElementById('refresh').onclick=()=>refresh(false,false);document.getElementById('fullRefresh').onclick=()=>refresh(false,true);document.getElementById('taskFiltersButton').onclick=()=>{const panel=document.getElementById('taskFiltersPanel');renderTaskFilters();panel.hidden=!panel.hidden};renderTaskFilters();updateTaskFilterUi();setMobileMode('canvas');document.querySelectorAll('[data-mobile-mode]').forEach(button=>button.onclick=()=>setMobileMode(button.dataset.mobileMode));document.getElementById('live').onchange=updateSyncUi;document.getElementById('notificationsButton').onclick=()=>{const panel=document.getElementById('notificationPanel');panel.hidden=!panel.hidden};document.addEventListener('click',event=>{const panel=document.getElementById('notificationPanel'),button=document.getElementById('notificationsButton');if(!panel.hidden&&!panel.contains(event.target)&&!button.contains(event.target))panel.hidden=true});document.getElementById('themeToggle').onclick=()=>{const dark=!document.documentElement.classList.contains('dark');localStorage.setItem('ela-theme',dark?'dark':'light');setTheme(dark)};document.getElementById('expandAll').onclick=()=>{state.plans.forEach(p=>state.expanded.add(p.id));renderTree()};document.getElementById('collapseAll').onclick=()=>{state.expanded=new Set(['plant']);renderTree()};document.getElementById('plus').onclick=()=>zoomAt(1.2);document.getElementById('minus').onclick=()=>zoomAt(.83);document.getElementById('fit').onclick=fit;document.getElementById('planTasksButton').onclick=()=>{const plan=state.plans.find(item=>item.id===state.currentPlan);if(plan)openPlanTasks(plan.id)};document.getElementById('newPlanButton').onclick=()=>openEntityModal('plan');document.getElementById('newEquipmentButton').onclick=()=>openEntityModal('equipment');document.getElementById('closeEntityModal').onclick=closeEntityModal;document.getElementById('entityModal').onclick=e=>{if(e.target.id==='entityModal')closeEntityModal()};document.getElementById('copyCanvasLink').onclick=()=>{const plan=state.plans.find(item=>item.id===state.currentPlan);if(plan)copyServiceLink(objectServiceLink(plan,'plan'),document.getElementById('copyCanvasLink'))};search.oninput=()=>{searchCursor=0;renderTree();renderSearchResults()};search.onfocus=()=>renderSearchResults();document.getElementById('clearSearch').onclick=clearSearchValue;document.getElementById('searchPrev').onclick=()=>{search.focus();moveSearchCursor(-1)};document.getElementById('searchNext').onclick=()=>{search.focus();moveSearchCursor(1)};search.onkeydown=handleSearchKeyboard;document.addEventListener('keydown',handleSearchKeyboard,true);document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap')&&!e.target.closest('#mobileSearchPanel'))document.getElementById('searchResults').hidden=true;if(!e.target.closest('.filter-wrap')&&!e.target.closest('#taskFiltersPanel')&&!e.target.closest('[data-mobile-mode="filters"]'))document.getElementById('taskFiltersPanel').hidden=true});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();search.focus();search.select()}});document.getElementById('closeModal').onclick=()=>document.getElementById('taskModal').classList.remove('open');document.getElementById('taskModal').onclick=e=>{if(e.target.id==='taskModal')e.currentTarget.classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('taskModal').classList.remove('open')});const shouldAutoSync=()=>document.getElementById('live').checked&&document.visibilityState==='visible';setInterval(()=>{if(shouldAutoSync())refresh(true)},CONFIG.intervalMs);setInterval(()=>{if(shouldAutoSync())refreshCommentNotifications()},CONFIG.intervalMs);document.addEventListener('visibilitychange',()=>{if(shouldAutoSync())refresh(true)});pendingNotifications=readStorage(COMMENT_UNSEEN_KEY,[]);syncNotificationState();initCurrentUser();const cachedSnapshot=readSnapshotCache();if(cachedSnapshot)applySnapshot(cachedSnapshot,'cache');refresh(true);
