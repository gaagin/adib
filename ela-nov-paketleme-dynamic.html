let state={plans:[],equipment:[],currentPlan:'plant',selected:null,expanded:new Set(['plant','ela']),scale:1,ox:0,oy:0,drag:null,last:null,lastSync:null,snapGuides:{x:null,y:null}};

function children(id){return state.plans.filter(p=>p.parentId===id)}

function relatedCount(id){return state.equipment.filter(e=>e.planId===id).length+descendants(id).reduce((n,p)=>n+relatedCount(p.id),0)}
const taskFilters={completed:'open',source:'',process:'',priority:'',tapsirildi:'',dateFrom:'',dateTo:''};
function taskPropertyValues(key){const values=new Set();for(const machine of state.equipment)for(const task of machine.tasks||[]){if(key==='tapsirildi'){for(const value of Array.isArray(task.tapsirildi)?task.tapsirildi:[])if(value)values.add(value)}else{const value=key==='source'?(task.sourceKey||''):key==='process'?(task.process||task.status||''):key==='priority'?(task.priority||''):'';if(value)values.add(value)}}return [...values].sort((a,b)=>String(a).localeCompare(String(b),'ru'))}
function taskMatchesFilters(task){if(taskFilters.completed==='open'&&task.completed)return false;if(taskFilters.completed==='done'&&!task.completed)return false;if(taskFilters.source&&(task.sourceKey||'')!==taskFilters.source)return false;if(taskFilters.process&&(task.process||task.status||'')!==taskFilters.process)return false;if(taskFilters.priority&&(task.priority||'')!==taskFilters.priority)return false;if(taskFilters.tapsirildi&&!(Array.isArray(task.tapsirildi)?task.tapsirildi:[]).includes(taskFilters.tapsirildi))return false;const date=String(task.date||'').slice(0,10);if(taskFilters.dateFrom&&(!date||date<taskFilters.dateFrom))return false;if(taskFilters.dateTo&&(!date||date>taskFilters.dateTo))return false;return true}
function taskFilterCount(){return ['source','process','priority','tapsirildi','dateFrom','dateTo'].filter(key=>taskFilters[key]).length+(taskFilters.completed!=='open'?1:0)}
function filterOptions(values,current,label){return '<option value="">'+label+'</option>'+values.map(value=>'<option value="'+escapeHtml(value)+'"'+(value===current?' selected':'')+'>'+escapeHtml(value)+'</option>').join('')}
function renderTaskFilters(){const panel=document.getElementById('taskFiltersPanel');if(!panel)return;panel.innerHTML='<h3>Фильтры задач</h3><div class="task-filter-field"><label>Состояние</label><select data-task-filter="completed">'+filterOptions(['open','done','all'],taskFilters.completed,'Незавершенные') .replace('value="open"','value="open"') .replace('<option value="done">done</option>','<option value="done">Выполненные</option>').replace('<option value="all">all</option>','<option value="all">Все задачи</option>')+'</select></div><div class="task-filter-field"><label>База</label><select data-task-filter="source">'+filterOptions(['todo','gorulen'],taskFilters.source,'Все базы').replace('<option value="todo">todo</option>','<option value="todo">ToDo</option>').replace('<option value="gorulen">gorulen</option>','<option value="gorulen">Gorulen isler</option>')+'</select></div><div class="task-filter-field"><label>Процесс</label><select data-task-filter="process">'+filterOptions(taskPropertyValues('process'),taskFilters.process,'Все процессы')+'</select></div><div class="task-filter-field"><label>Приоритет</label><select data-task-filter="priority">'+filterOptions(taskPropertyValues('priority'),taskFilters.priority,'Все приоритеты')+'</select></div><div class="task-filter-field"><label>Tapsirildi</label><select data-task-filter="tapsirildi">'+filterOptions(taskPropertyValues('tapsirildi'),taskFilters.tapsirildi,'Все ответственные')+'</select></div><div class="task-filter-field"><label>Дата</label><div class="task-filter-dates"><input type="date" data-task-filter="dateFrom" value="'+escapeHtml(taskFilters.dateFrom)+'" title="Дата от"><input type="date" data-task-filter="dateTo" value="'+escapeHtml(taskFilters.dateTo)+'" title="Дата до"></div></div><div class="task-filter-actions"><button type="button" id="clearTaskFilters">Сбросить</button><button type="button" class="primary-filter" id="applyTaskFilters">Готово</button></div>';panel.querySelectorAll('[data-task-filter]').forEach(input=>{input.onchange=()=>{taskFilters[input.dataset.taskFilter]=input.value;updateTaskFilterUi()};input.oninput=()=>{taskFilters[input.dataset.taskFilter]=input.value;updateTaskFilterUi()}});document.getElementById('clearTaskFilters').onclick=()=>{Object.assign(taskFilters,{completed:'open',source:'',process:'',priority:'',tapsirildi:'',dateFrom:'',dateTo:''});renderTaskFilters();updateTaskFilterUi()};document.getElementById('applyTaskFilters').onclick=()=>{panel.hidden=true;updateTaskFilterUi()}}
function updateTaskFilterUi(){const count=taskFilterCount(),button=document.getElementById('taskFiltersButton'),badge=document.getElementById('taskFilterCount');if(button)button.classList.toggle('has-filters',count>0);if(badge){badge.textContent=count?String(count):'';badge.hidden=!count}renderSearchResults();const modal=document.getElementById('taskModal');if(modal?.classList.contains('open')&&modal.dataset.machineId&&!document.querySelector('.task-editor'))openTasks(modal.dataset.machineId)}
let searchCursor=0;
function getSearchResults(){const q=search.value.trim().toLowerCase();if(!q)return[];const results=[];const add=(kind,id,title,subtitle,text,extra={})=>{const hay=String(text||'').toLowerCase();if(!hay.includes(q))return;const starts=hay.indexOf(q)===0||String(title).toLowerCase().startsWith(q);results.push({kind,id,title,subtitle,score:starts?0:1,...extra})};for(const plan of state.plans)add('plan',plan.id,plan.name,plan.parentId?(state.plans.find(p=>p.id===plan.parentId)?.name||'План'): 'Корневой план',[plan.name,plan.type,plan.status,plan.note].join(' '));for(const machine of state.equipment){const plan=state.plans.find(p=>p.id===machine.planId);add('equipment',machine.id,machine.name,[plan?.name||'План',machine.type,machine.status].filter(Boolean).join(' · '),[machine.name,machine.type,machine.status,machine.note,plan?.name].join(' '),{machine});for(const task of machine.tasks||[]){if(!taskMatchesFilters(task))continue;add('task',task.id,task.title||'Без названия',[machine.name,plan?.name,task.source||'Задача'].filter(Boolean).join(' · '),[task.title,task.source,task.status,task.process,task.priority,machine.name,plan?.name].join(' '),{task,machine})}}return results.sort((a,b)=>a.score-b.score||String(a.title).localeCompare(String(b.title),'ru')).slice(0,14)}
function renderSearchResults(){const panel=document.getElementById('searchResults');if(!panel)return;const query=search.value.trim();if(!query){panel.hidden=true;panel.innerHTML='';return}const items=getSearchResults();searchCursor=Math.min(searchCursor,Math.max(0,items.length-1));if(!items.length){panel.innerHTML='<div class="search-empty">Ничего не найдено</div><div class="search-hint">Попробуйте название плана, машины или задачи</div>';panel.hidden=false;return}panel.innerHTML='<div class="search-results-head">Результаты поиска</div>'+items.map((item,index)=>'<div class="search-result '+(index===searchCursor?'active':'')+'" role="button" tabindex="0" data-search-index="'+index+'" data-kind="'+item.kind+'"><span class="search-result-icon">'+(item.kind==='equipment'?'⚙':item.kind==='task'?'✓':'▦')+'</span><span><strong>'+escapeHtml(item.title)+'</strong><small>'+escapeHtml(item.subtitle||'')+'</small></span>'+(item.kind==='equipment'?'<span class="search-result-actions"><button type="button" class="search-quick-task" data-search-task-index="'+index+'">+ Задача</button></span>':'')+'</div>').join('')+'<div class="search-hint">↑ ↓ выбрать · Enter открыть · «+ Задача» сразу открыть новую задачу</div>';panel.hidden=false;panel.querySelectorAll('[data-search-index]').forEach(row=>{row.onclick=event=>{if(event.target.closest('[data-search-task-index]'))return;const item=items[Number(row.dataset.searchIndex)];if(item)focusSearchResult(item)};row.onkeydown=event=>{if((event.key==='Enter'||event.key===' ')&&!event.target.closest('[data-search-task-index]')){event.preventDefault();const item=items[Number(row.dataset.searchIndex)];if(item)focusSearchResult(item)}}});panel.querySelectorAll('[data-search-task-index]').forEach(button=>{const openFromButton=event=>{event.preventDefault();event.stopPropagation();const item=items[Number(button.dataset.searchTaskIndex)];if(!item||item.kind!=='equipment')return;openNewTaskForMachine(item.machine)};button.onclick=openFromButton;button const SNAP_DISTANCE=8;
const SNAP_FULL_DISTANCE=1.5;
const SNAP_MIN_STRENGTH=.2;
function snapTargets(excludeId){const xs=[0,CANVAS_WIDTH],ys=[0,CANVAS_HEIGHT];for(const other of visibleObjects()){if(other.id===excludeId)continue;const x=Number(other.x)||0,y=Number(other.y)||0,w=Math.max(0,Number(other.width)||0),h=Math.max(0,Number(other.height)||0);xs.push(x,x+w/2,x+w);ys.push(y,y+h/2,y+h)}return{xs,ys}}
function nearestSnap(raw,offsets,targets,disabled){if(disabled)return{value:raw,guide:null};let best=null;for(const offset of offsets)for(const target of targets){const distance=Math.abs(raw+offset-target);if(distance<=SNAP_DISTANCE&&(!best||distance<best.distance))best={target,offset,distance}}if(!best)return{value:raw,guide:null};const correction=best.target-(raw+best.offset);const strength=best.distance<=SNAP_FULL_DISTANCE?1:SNAP_MIN_STRENGTH+(1-SNAP_MIN_STRENGTH)*(SNAP_DISTANCE-best.distance)/(SNAP_DISTANCE-SNAP_FULL_DISTANCE);return{value:raw+correction*strength,guide:best.target}}
function clampPosition(value,max){return Math.max(0,Math.min(max,value))}
function snapMove(o,rawX,rawY,disabled){const targets=snapTargets(o.id);const sx=nearestSnap(rawX,[0,Number(o.width)/2,Number(o.width)],targets.xs,disabled);const sy=nearestSnap(rawY,[0,Number(o.height)/2,Number(o.height)],targets.ys,disabled);return{x:clampPosition(sx.value,CANVAS_WIDTH-Number(o.width)),y:clampPosition(sy.value,CANVAS_HEIGHT-Number(o.height)),guideX:sx.guide,guideY:sy.guide}}
function snapResize(o,rawWidth,rawHeight,disabled){const targets=snapTargets(o.id);const right=nearestSnap(Number(o.x)+rawWidth,[0],targets.xs,disabled);const bottom=nearestSnap(Number(o.y)+rawHeight,[0],targets.ys,disabled);return{width:Math.max(35,right.value-Number(o.x)),height:Math.max(30,bottom.value-Number(o.y)),guideX:right.guide,guideY:bottom.guide}}

bute('class','icon-circle');const tx=addText(o.x+o.width-18,o.y+23,o.kind==='equipment'?'✓':'↗','icon-text');icon.append(c,tx);icon.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault()});icon.addEventListener('click',e=>{e.stopPropagation();o.kind==='equipment'?openTasks(o.id):openPlan(o.id)});g.appendChild(icon);if(o.kind==='equipment'&&newCommentTaskIds.has(o.id)){const alert=document.createElementNS(ns,'g');alert.setAttribute('class','machine-comment-badge');alert.setAttribute('title','Новое сообщение по задаче этой машины');const badge=document.createElementNS(ns,'circle');badge.setAttribute('cx',o.x+14);badge.setAttribute('cy',o.y+18);badge.setAttribute('r',10);const mark=addText(o.x+14,o.y+22,'!','');alert.append(badge,mark);g.appendChild(alert)}if(state.selected===o.id){const h=document.createElementNS(ns,'rect');h.setAttribute('x',o.x+o.width-9);h.setAttribute('y',o.y+o.height-9);h.setAttribute('width',18);h.setAttribute('height',18);h.setAttribute('rx',3);h.setAttribute('class','resize-handle');h.addEventListener('pointerdown',e=>startResize(e,o.id,o.kind));g.appendChild(h)}layer.appendChild(g)}renderGuides()}

function openTasks(id){const o=state.equipment.find(x=>x.id===id);if(!o)return;document.getElementById('taskModal').dataset.machineId=id;document.getElementById('modalTitle').textContent='Незавершенные задачи: '+o.name;document.getElementById('modalSub').textContent=state.plans.find(p=>p.id===o.planId)?.name||'';const tasks=(o.tasks||[]).filter(t=>taskMatchesFilters(t));const head='<div class="task-list-head"><span>'+tasks.length+' задач</span><button id="newTask" class="primary">+ Новая задача</button></div>';const rows=tasks.map((t,i)=>'<div class="task task-clickable" data-task-index="'+i+'"><span class="check"></span><div><div class="task-title">'+escapeHtml(t.title)+'</div><div class="task-meta">'+[t.source,t.tapsirildi?.length?'Tapsirildi: '+t.tapsirildi.join(', '):'',t.meta,t.date].filter(Boolean).map(escapeHtml).join(' · ')+'</div>'+(t.url?'<a data-task-link href="'+escapeHtml(t.url)+'" target="_blank" rel="noopener" style="color:var(--blue);font-size:12px">Открыть в Notion</a>':'')+'</div><span class="task-status">'+escapeHtml(t.status||'Открыта')+'</span></div>').join('');document.getElementById('taskList').innerHTML=head+(rows||'<div class="muted" style="padding:18px 0">Незавершенных задач нет.</div>');document.getElementById('newTask').onclick=()=>openTaskEditor({sourceKey:'todo',source:'ToDo',title:'',process:'',priority:'',date:'',tapsirildi:[],completed:false},o,true);document.querySelectorAll('.task-clickable').forEach(item=>item.onclick=()=>openTaskEditor(tasks[Number(item.dataset.taskIndex)],o,false));document.querySelectorAll('[data-task-link]').forEach(link=>link.onclick=e=>e.stopPropagation());document.getElementById('taskModal').classList.add('open')}
function setMobileMode(mode){const layout=document.getElementById('layout'),treePanel=document.getElementById('treePanel'),inspectorPanel=document.getElementById('inspector'),filterPanel=document.getElementById('taskFiltersPanel');const visualMode=mode==='tree'||mode==='inspector'?mode:'canvas';layout.classList.remove('mobile-canvas-mode','mobile-tree-mode','mobile-inspector-mode');layout.classList.add('mobile-'+visualMode+'-mode');treePanel.classList.toggle('collapsed',visualMode!=='tree');inspectorPanel.classList.toggle('collapsed',visualMode!=='inspector');if(mobileSearchPanel)mobileSearchPanel.hidden=mode!=='search';if(mode==='filters'){renderTaskFilters();filterPanel.hidden=false}else if(mode!=='filters')filterPanel.hidden=true;if(mode==='search'){layout.classList.add('mobile-canvas-mode');treePanel.classList.add('collapsed');inspectorPanel.classList.add('collapsed');search.focus();search.select();renderSearchResults()}document.querySelectorAll('[data-mobile-mode]').forEach(button=>button.classList.toggle('active',button.dataset.mobileMode===mode))}

function point(x,y){const r=svg.getBoundingClientRect();return{x:(x-r.left)/r.width*CANVAS_WIDTH,y:(y-r.top)/r.height*CANVAS_HEIGHT}}
function apply(){viewport.setAttribute('transform',`translate(${state.ox} ${state.oy}) scale(${state.scale})`)}
function fit(){state.scale=1;state.ox=0;state.oy=0;apply()}
function zoomAt(f,x=svg.getBoundingClientRect().left+svg.clientWidth/2,y=svg.getBoundingClientRect().top+svg.clientHeight/2){const p=point(x,y),old=state.scale;state.scale=Math.max(.35,Math.min(3,+(state.scale*f).toFixed(3)));state.ox=p.x-(p.x-state.ox)*(state.scale/old);state.oy=p.y-(p.y-state.oy)*(state.scale/old);apply()}
function startDrag(e,id,kind){if(e.target.closest&&(e.target.closest('.icon')||e.target.closest('.resize-handle')))return;const a=state.equipment.find(x=>x.id===id)||state.plans.find(x=>x.id===id);if(!a)return;e.preventDefault();e.stopPropagation();const start=point(e.clientX,e.clientY);state.selected=id;state.drag={id,kind,mode:'move',startPoint:start,baseX:Number(a.x)||0,baseY:Number(a.y)||0,startValues:{x:Number(a.x)||0,y:Number(a.y)||0,width:Number(a.width)||0,height:Number(a.height)||0}};state.last=start;state.snapGuides={x:null,y:null};svg.setPointerCapture(e.pointerId)}
function startResize(e,id,kind){const a=state.equipment.find(x=>x.id===id)||state.plans.find(x=>x.id===id);if(!a)return;e.preventDefault();e.stopPropagation();const start=point(e.clientX,e.clientY);state.selected=id;state.drag={id,kind,mode:'resize',startPoint:start,baseWidth:Number(a.width)||35,baseHeight:Number(a.height)||30,startValues:{x:Number(a.x)||0,y:Number(a.y)||0,width:Number(a.width)||0,height:Number(a.height)||0}};state.last=start;state.snapGuides={x:null,y:null};svg.setPointerCapture(e.pointerId)}
svg.addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('.machine,.plan-box,.icon,.resize-handle'))return;state.drag={kind:'canvas',mode:'pan'};state.last=point(e.clientX,e.clientY);state.snapGuides={x:null,y:null};svg.setPointerCapture(e.pointerId);svg.classList.add('panning')});svg.addEventListener('pointermove',e=>{if(!state.drag||!state.last)return;const p=point(e.clientX,e.clientY),dx=p.x-state.last.x,dy=p.y-state.last.y;if(state.drag.mode==='pan'){state.ox+=dx;state.oy+=dy}else{const a=state.equipment.find(x=>x.id===state.drag.id)||state.plans.find(x=>x.id===state.drag.id);if(a){const disabled=e.altKey;const start=state.drag.startPoint;if(state.drag.mode==='resize'){const rawWidth=Math.max(35,state.drag.baseWidth+(p.x-start.x)/state.scale);const rawHeight=Math.max(30,state.drag.baseHeight+(p.y-start.y)/state.scale);const snapped=snapResize(a,rawWidth,rawHeight,disabled);a.width=snapped.width;a.height=snapped.height;state.snapGuides={x:disabled?null:snapped.guideX,y:disabled?null:snapped.guideY}}else{const rawX=state.drag.baseX+(p.x-start.x)/state.scale;const rawY=state.drag.baseY+(p.y-start.y)/state.scale;const snapped=snapMove(a,rawX,rawY,disabled);a.x=snapped.x;a.y=snapped.y;state.snapGuides={x:disabled?null:snapped.guideX,y:disabled?null:snapped.guideY}}renderCanvas();renderInspector()}}state.last=p;apply()});function stopDrag(e){if(state.drag?.mode!=='pan'&&state.drag){const a=state.equipment.find(x=>x.id===state.drag.id)||state.plans.find(x=>x.id===state.drag.id);const before=state.drag.startValues;const changed=a&&before&&['x','y','width','height'].some(key=>Math.abs(Number(a[key])-Number(before[key]))>0.25);if(changed)saveLocalPosition(a)}state.snapGuides={x:null,y:null};state.drag=null;state.last=null;renderGuides();svg.classList.remove('panning');if(e&&svg.hasPointerCapture(e.pointerId))svg.releasePointerCapture(e.pointerId)}svg.addEventListener('pointerup',stopDrag);svg.addEventListener('pointercancel',stopDrag);svg.addEventListe function saveLocalPosition(a){const layout={x:a.x,y:a.y,width:a.width,height:a.height};pendingLayouts.set(a.id,layout);try{const saved=JSON.parse(localStorage.getItem('ela-layout-edits')||'{}');saved[a.id]=layout;localStorage.setItem('ela-layout-edits',JSON.stringify(saved))}catch(e){}writeSnapshotCache({plans:state.plans,equipment:state.equipment});saveRemotePosition(a)}

async function refresh(silent=false,full=false){if(refreshInFlight)return;refreshInFlight=true;const err=document.getElementById('syncError');err.textContent='';try{if(!CONFIG.syncUrl){applySnapshot(JSON.parse(JSON.stringify(demo)),'demo');return}const endpoint=CONFIG.syncUrl+(CONFIG.syncUrl.includes('?')?'&':'?')+(full?'full=1':'incremental=1');const headers={};if(snapshotEtag&&!full)headers['If-None-Match']=snapshotEtag;const r=await fetch(endpoint,{cache:'no-store',headers});if(r.status===304){state.lastSync=new Date();updateSyncUi();return}if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();const etag=r.headers.get('ETag')||data.etag||'';if(etag){snapshotEtag=etag;localStorage.setItem('ela-snapshot-etag',etag)}applySnapshot(data,'notion')}catch(e){err.textContent='Ошибка синхронизации: '+e.message;if(!silent)alert('Не удалось обновить данные. '+e.message)}finally{refreshInFlight=false}}
